<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlast | Media Feed</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header Navigation */
        .nav {
            width: 100%;
            background: #111;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00ffcc;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo { font-size: 24px; font-weight: 900; color: #00ffcc; letter-spacing: 2px; }

        /* The Media Feed */
        #media-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        .post-card {
            background: #1a1a1a;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid #333;
            overflow: hidden;
        }

        .post-card img { width: 100%; display: block; }

        .caption { padding: 15px; font-size: 16px; border-top: 1px solid #333; }

        /* Floating Add Button */
        .plus-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 50%;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        /* Upload Overlay */
        #upload-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .upload-box {
            background: #222;
            padding: 30px;
            border-radius: 20px;
            width: 85%;
            max-width: 400px;
            text-align: center;
        }

        .upload-box h2 { margin-top: 0; color: #00ffcc; }

        #caption-input {
            width: 100%;
            height: 100px;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 10px;
            margin: 20px 0;
            box-sizing: border-box;
        }

        .submit-btn {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="nav">
        <div class="logo">CONLAST</div>
    </div>

    <div id="media-container">
        </div>

    <button class="plus-btn" onclick="openMenu()">+</button>

    <div id="upload-overlay">
        <div class="upload-box">
            <h2>New Post</h2>
            
            <button onclick="document.getElementById('gallery-input').click()" style="padding: 10px;">PICK IMAGE FROM GALLERY</button>
            <input type="file" id="gallery-input" accept="image/*" style="display:none">
            
            <p id="file-ready" style="color:#888; font-size:12px;">No image selected</p>

            <textarea id="caption-input" placeholder="Enter conlang caption..."></textarea>
            
            <button class="submit-btn" onclick="handlePost()">POST TO MEDIA</button>
            <button onclick="closeMenu()" style="background:none; color:#888; border:none; margin-top:15px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('media-container');
        const fileInput = document.getElementById('gallery-input');
        const overlay = document.getElementById('upload-overlay');

        // LOAD SAVED POSTS FROM MEMORY
        window.onload = () => {
            const saved = JSON.parse(localStorage.getItem('conlast_v1')) || [];
            saved.forEach(p => renderPost(p.img, p.cap));
        };

        function openMenu() { overlay.style.display = 'flex'; }
        function closeMenu() { overlay.style.display = 'none'; }

        fileInput.onchange = () => {
            document.getElementById('file-ready').innerText = fileInput.files[0] ? "Image Ready: " + fileInput.files[0].name : "No image selected";
        };

        function handlePost() {
            const caption = document.getElementById('caption-input').value;
            const file = fileInput.files[0];

            if (!file) return alert("Open your gallery and pick an image!");

            const reader = new FileReader();
            reader.onload = (e) => {
                const imgData = e.target.result;

                // 1. Show on Screen
                renderPost(imgData, caption);

                // 2. Save to Memory (localStorage)
                const saved = JSON.parse(localStorage.getItem('conlast_v1')) || [];
                saved.unshift({ img: imgData, cap: caption });
                localStorage.setItem('conlast_v1', JSON.stringify(saved));

                // 3. Clear and Close
                document.getElementById('caption-input').value = '';
                fileInput.value = '';
                closeMenu();
            };
            reader.readAsDataURL(file);
        }

        function renderPost(img, cap) {
            const div = document.createElement('div');
            div.className = 'post-card';
            div.innerHTML = `<img src="${img}"><div class="caption">${cap}</div>`;
            container.prepend(div);
        }
    </script>
</body>
</html>
